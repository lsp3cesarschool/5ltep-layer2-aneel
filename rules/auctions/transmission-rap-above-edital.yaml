schema_version: "1.0"
rule_version: "0.1.0"
origin: expert

description:
  language: pt-BR
  title: "RAP vencedora do leilão de transmissão acima da RAP do edital"
  title_translations:
    en: "Winning annual revenue (RAP) above the auction's ceiling"
  text: >
    Confere, em cada lote de leilão de transmissão, se a receita anual permitida (RAP) vencedora não passa da RAP do edital.
  justification: >
    A RAP do edital é o teto do leilão de transmissão; a vencedora deve ser igual ou menor. Valor maior
    indica erro de registro ou de base. Valores com vírgula decimal. É sinal para revisão.
  exceptions:
    - "Lotes com RAP em bases de data diferentes não são comparáveis."
  examples:
    - case: "RAP do edital 50000000,00 e vencedora 38000000,00"
      expected: "Conforme"
    - case: "RAP do edital 50000000,00 e vencedora 52000000,00"
      expected: "Sinalizar"

sources:
  aneel_leiloes_transmissao:
    portal: https://dadosabertos.aneel.gov.br
    dataset: resultado-de-leiloes
    resource: {name: "resultado-leiloes-transmissao.csv", format: CSV}
    file: {format: csv, encoding: latin-1, delimiter: ";"}
    columns:
      VlrRAPEditalLeilao: {meaning: "RAP máxima do lote no edital", type: number, decimal: ","}
      VlrRAPVencedorLeilao: {meaning: "RAP do lance vencedor", type: number, decimal: ","}
      DatLeilao: {meaning: "Data do leilão", type: date, format: "%Y-%m-%d"}

check:
  template: field-comparison
  timeline: aneel_leiloes_transmissao.DatLeilao
  left: aneel_leiloes_transmissao.VlrRAPVencedorLeilao
  op: "<="
  right: aneel_leiloes_transmissao.VlrRAPEditalLeilao
